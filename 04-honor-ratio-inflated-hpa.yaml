# A5 - node [1] of the tree, reached from availability for the first time.
#
# Before f761f26 the availability flow sized request and limit independently and never went through
# applyRequestLimitGuardrails at all, so honorCpuRequestLimitRatio was silently ignored there - it only
# ever applied to cost optimization. This workload turns it on and then saturates CPU.
#
# Deployed ratio here is 500m / 250m = 2.0.
#
# EXPECT (post-fix): the availability recommendation comes back holding limit/request = 2.0
#   core log: "holding the deployed limit/request ratio of 2.00 - request X -> Y, limit A -> B"
# and then node [2] runs against the held pair: request 250m x 170% = 425m, which is under a limit of
# 500m, so it proceeds unchanged. Holding the ratio is usually enough to keep the scale-out point valid
# on its own - that is why node [1] runs first.
#
# EXPECT (pre-fix): the ratio is not held; request and limit move independently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflated-hpa-honor-ratio
  namespace: sedai-inflated-hpa
  annotations:
    settings.sedai.io/metricsEvaluation.minPeriodInHours: "1"
    settings.sedai.io/availability.configMode: AUTO
    # The setting the availability flow could not previously see. If your build rejects this annotation
    # key, set "Honor CPU request/limit ratio" on the resource in the Sedai UI instead - the annotation
    # is only a convenience.
    settings.sedai.io/enableVerticalScaling.honorCpuRequestLimitRatio: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inflated-hpa-honor-ratio
  template:
    metadata:
      labels:
        app: inflated-hpa-honor-ratio
    spec:
      containers:
        - name: burner
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["while true; do :; done"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inflated-hpa-honor-ratio
  namespace: sedai-inflated-hpa
spec:
  type: ClusterIP
  selector:
    app: inflated-hpa-honor-ratio
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inflated-hpa-honor-ratio
  namespace: sedai-inflated-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inflated-hpa-honor-ratio
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 170
