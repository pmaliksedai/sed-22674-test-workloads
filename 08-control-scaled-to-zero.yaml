# B2 - CONTROL for 7d97fab. A workload that really is scaled to zero.
#
# All three tiers of getEffectiveReplicaCount return 0 here: no spec replicas, no status replicas, no
# discovered pods. The fix must NOT make this one actionable.
#
# EXPECT: still excluded, notes still read "Resource Doesn't have any Replicas.", ZERO_REPLICAS blocker
# still present. If this workload starts generating recommendations, the fallback is too permissive.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genuinely-scaled-to-zero
  namespace: sedai-inflated-hpa
  annotations:
    settings.sedai.io/metricsEvaluation.minPeriodInHours: "1"
    settings.sedai.io/availability.configMode: AUTO
spec:
  replicas: 0
  selector:
    matchLabels:
      app: genuinely-scaled-to-zero
  template:
    metadata:
      labels:
        app: genuinely-scaled-to-zero
    spec:
      containers:
        - name: burner
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["while true; do :; done"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
