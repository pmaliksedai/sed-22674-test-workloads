# A3 - the memory half of f761f26. The same decision tree runs from
# KubernetesAvailabilityServiceV2.recommendNewMemoryRequestLimits, and honorMemoryRequestLimitRatio was
# ignored in that flow for the same reason.
#
#     memory: 170% x (256Mi request / 512Mi limit) = "scale out at 85% of the limit" = 435Mi
#
# The load holds ~430Mi of tmpfs (an emptyDir with medium: Memory counts against the container's memory
# cgroup, so it shows up in container_memory_working_set_bytes exactly like heap would).
#
#   430Mi / 512Mi = 0.84  -> above kubernetesMemorySaturationPercent 0.75, so saturation fires
#   430Mi / 256Mi = 168%  -> just under the 170% target, so the HPA itself stays quiet and the workload
#                            is stable while Sedai looks at it
#
# EXPECT (post-fix): an availability recommendation on memory whose proposed pair satisfies
#     proposedRequest x 1.70 x 1.05 <= proposedLimit
#
# Note the headroom is deliberately thin (430Mi held inside a 512Mi limit). If you see OOMKills, drop the
# dd count to 400 - saturation still fires at 400Mi/512Mi = 0.78.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflated-hpa-mem-sat
  namespace: sedai-inflated-hpa
  annotations:
    settings.sedai.io/metricsEvaluation.minPeriodInHours: "1"
    settings.sedai.io/availability.configMode: AUTO
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inflated-hpa-mem-sat
  template:
    metadata:
      labels:
        app: inflated-hpa-mem-sat
    spec:
      volumes:
        - name: hold
          emptyDir:
            medium: Memory
            sizeLimit: 480Mi
      containers:
        - name: holder
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - "dd if=/dev/zero of=/hold/block bs=1M count=430 && while true; do sleep 3600; done"
          volumeMounts:
            - name: hold
              mountPath: /hold
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inflated-hpa-mem-sat
  namespace: sedai-inflated-hpa
spec:
  type: ClusterIP
  selector:
    app: inflated-hpa-mem-sat
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inflated-hpa-mem-sat
  namespace: sedai-inflated-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inflated-hpa-mem-sat
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 170
